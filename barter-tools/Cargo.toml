[package]
name = "barter-tools"
version = "0.1.0"
edition = "2021"
description = "CLI tools for Barter data pipeline - backfill, verification, and conversion"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Parquet/Arrow
arrow = { version = "54", default-features = false, features = ["ipc"] }
parquet = { version = "54", default-features = false, features = ["arrow", "snap"] }

# CSV parsing
csv = "1.3"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Command-line
clap = { version = "4", features = ["derive"] }

# Progress bars
indicatif = "0.17"

# Error handling
thiserror = "2"
anyhow = "1"

# File handling
tempfile = "3"
flate2 = "1"  # For gzip decompression
zip = "2"    # For zip decompression

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "binance-downloader"
path = "src/bin/binance_downloader.rs"

[[bin]]
name = "csv-to-parquet"
path = "src/bin/csv_to_parquet.rs"

[[bin]]
name = "verify-parquet"
path = "src/bin/verify_parquet.rs"

[[bin]]
name = "check-gaps"
path = "src/bin/check_gaps.rs"
