[package]
name = "barter-data-server"
version = "0.1.0"
edition = "2024"
authors = ["JustAStream <justastream.code@gmail.com>"]
license = "MIT"
description = "WebSocket server for broadcasting real-time market data from barter-data"

[dependencies]
# Barter Ecosystem
barter-data = { workspace = true }
barter-instrument = { workspace = true }
barter-integration = { workspace = true }
barter-trading-tuis = { path = "../barter-trading-tuis" }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

# Async
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "net"] }
futures = { workspace = true }

# WebSocket
tokio-tungstenite = { workspace = true }

# SerDe
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }

# HTTP for REST polling
reqwest = { workspace = true }

# Misc
chrono = { workspace = true }
bytes = { workspace = true }
rust_decimal = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Parquet/Arrow for Nautilus-compatible data storage
# Using version 54 for chrono 0.4.42 compatibility
arrow = { version = "54", default-features = false, features = ["ipc"] }
parquet = { version = "54", default-features = false, features = ["arrow", "snap"] }

# AWS S3 for cloud storage
aws-config = "1.5"
aws-sdk-s3 = "1.65"

# Additional utilities
async-trait = { workspace = true }
thiserror = { workspace = true }
vecmap-rs = { workspace = true }

[[bin]]
name = "load-test"
path = "src/load_test.rs"

[[bin]]
name = "generate-sample-parquet"
path = "src/bin/generate_sample_parquet.rs"

[dev-dependencies]
tempfile = "3"
rust_decimal_macros = "1"
